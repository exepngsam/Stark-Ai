<svg width="100%" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="radar-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>

    <!-- Conic Beam Sweep -->
    <linearGradient id="sweep-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="blip-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes sweep360 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes blipAlert {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.4); opacity: 0.3; }
    }
    @keyframes radarPulse {
      0% { r: 10; opacity: 0.8; }
      100% { r: 105; opacity: 0; }
    }
    .sweep-rotor {
      transform-origin: 150px 140px;
      animation: sweep360 4s linear infinite;
    }
    .blip-pulse {
      transform-origin: center;
      animation: blipAlert 1.5s ease-in-out infinite;
    }
    .expanding-pulse {
      animation: radarPulse 3s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="280" rx="14" fill="url(#radar-card-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left: Animated Threat Radar Visualizer -->
  <g transform="translate(20, 0)">
    <!-- Radar Base Rings -->
    <circle cx="150" cy="140" r="105" fill="#03070d" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="150" cy="140" r="80" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle cx="150" cy="140" r="50" fill="none" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>
    <circle cx="150" cy="140" r="22" fill="none" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1"/>
    
    <!-- Range Pulse Ring -->
    <circle class="expanding-pulse" cx="150" cy="140" r="15" fill="none" stroke="#00f5ff" stroke-width="1.5"/>

    <!-- Reticle Crosshair axes -->
    <line x1="150" y1="35" x2="150" y2="245" stroke="#334155" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="45" y1="140" x2="255" y2="140" stroke="#334155" stroke-width="1" stroke-dasharray="2 3"/>
    
    <!-- Rotating Sweep Beam -->
    <g class="sweep-rotor">
      <line x1="150" y1="140" x2="150" y2="35" stroke="#00f5ff" stroke-width="2" filter="url(#blip-glow)"/>
      <path d="M 150 140 L 150 35 A 105 105 0 0 1 230 75 Z" fill="url(#sweep-beam)"/>
    </g>

    <!-- Radar Target Blips -->
    <g class="blip-pulse">
      <circle cx="185" cy="85" r="4.5" fill="#ef4444" filter="url(#blip-glow)"/>
      <circle cx="110" cy="180" r="4" fill="#f59e0b" filter="url(#blip-glow)"/>
      <circle cx="210" cy="170" r="4" fill="#00e575" filter="url(#blip-glow)"/>
    </g>
    <circle cx="150" cy="140" r="4" fill="#00f5ff"/>
  </g>

  <!-- Right: Real-Time Threat Telemetry Cards -->
  <g transform="translate(330, 35)">
    <!-- Header -->
    <text x="0" y="10" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" fill="#f1f5f9" letter-spacing="1">
      LIVE PERIMETER RADAR TELEMETRY
    </text>
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
      MONITORING ALL REGIONAL INGRESS CHANNELS IN REAL-TIME
    </text>

    <!-- Threat 1 Card: UPI Intent Disguise -->
    <g transform="translate(0, 50)">
      <rect width="630" height="42" rx="8" fill="#140c11" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#ef4444"/>
      <text x="36" y="25" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#fca5a5">CRITICAL // Fake UPI Cashback QR</text>
      <text x="310" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ef4444">DEBIT INTENT &amp; PIN TRAP DETECTED</text>
      <rect x="545" y="10" width="70" height="22" rx="4" fill="#ef4444" fill-opacity="0.2"/>
      <text x="556" y="25" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ef4444">98% RISK</text>
    </g>

    <!-- Threat 2 Card: Electricity Bill Phishing -->
    <g transform="translate(0, 102)">
      <rect width="630" height="42" rx="8" fill="#141108" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#f59e0b"/>
      <text x="36" y="25" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#fde68a">HIGH // Electricity Deadline Urgency</text>
      <text x="310" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b">UNVERIFIED SMS SENDER &amp; SPOOF URL</text>
      <rect x="545" y="10" width="70" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="556" y="25" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f59e0b">88% RISK</text>
    </g>

    <!-- Threat 3 Card: Verified Legitimate Merchant -->
    <g transform="translate(0, 154)">
      <rect width="630" height="42" rx="8" fill="#08140f" stroke="#00e575" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#00e575"/>
      <text x="36" y="25" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#86efac">SAFE // Verified Retail Merchant QR</text>
      <text x="310" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00e575">NORMAL RETAIL VPA // NO MALICIOUS PARAMETERS</text>
      <rect x="545" y="10" width="70" height="22" rx="4" fill="#00e575" fill-opacity="0.2"/>
      <text x="556" y="25" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00e575">0% RISK</text>
    </g>
  </g>
</svg>
