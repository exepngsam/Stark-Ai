<svg width="100%" height="340" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="100%" stop-color="#090f1a"/>
    </linearGradient>

    <!-- Glowing wire gradient -->
    <linearGradient id="wire-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#00e575"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="packet-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes flowPacket {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.9; }
    }
    @keyframes pingDot {
      0% { r: 3; opacity: 1; }
      100% { r: 9; opacity: 0; }
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: flowPacket 1.5s linear infinite;
    }
    .node-box {
      animation: pulseNode 3s ease-in-out infinite;
    }
    .ping-circle {
      animation: pingDot 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1000" height="340" rx="14" fill="url(#pipe-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Pipeline Header Title -->
  <text x="35" y="42" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="1">
    STARK AI // REAL-TIME THREAT MITIGATION PIPELINE
  </text>
  <text x="35" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
    END-TO-END LATENCY: ~82MS // ZERO PERSISTENCE PROTOCOL ACTIVE
  </text>

  <!-- Flow Connector Lines with Animated Flow -->
  <g stroke="url(#wire-grad)" stroke-width="2.5" class="flow-line">
    <!-- Node 1 -> Node 2 -->
    <path d="M 210 170 L 250 170" />
    <!-- Node 2 -> Node 3 -->
    <path d="M 420 170 L 460 170" />
    <!-- Node 3 -> Node 4 -->
    <path d="M 630 170 L 670 170" />
    <!-- Node 4 -> Node 5 -->
    <path d="M 840 170 L 880 170" />
  </g>

  <!-- ==================== STAGE 1: INGESTION ==================== -->
  <g transform="translate(35, 95)">
    <rect width="175" height="150" rx="10" fill="#0b1322" stroke="#00f5ff" stroke-width="1.5" class="node-box"/>
    <rect x="12" y="14" width="40" height="18" rx="4" fill="#00f5ff" fill-opacity="0.15"/>
    <text x="18" y="27" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#00f5ff">STAGE 01</text>
    
    <text x="14" y="56" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Vector Ingestion</text>
    <text x="14" y="74" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• SMS / WhatsApp text</text>
    <text x="14" y="90" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Phishing payment links</text>
    <text x="14" y="106" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Optical QR screenshots</text>
    
    <line x1="14" y1="120" x2="161" y2="120" stroke="#1e293b" stroke-width="1"/>
    <circle cx="22" cy="133" r="3" fill="#00f5ff"/>
    <text x="32" y="136" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f5ff">Ephemeral Buffer</text>
  </g>

  <!-- ==================== STAGE 2: OPENCV DECODER ==================== -->
  <g transform="translate(250, 95)">
    <rect width="170" height="150" rx="10" fill="#0b1322" stroke="#38bdf8" stroke-width="1.5" class="node-box"/>
    <rect x="12" y="14" width="40" height="18" rx="4" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="18" y="27" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38bdf8">STAGE 02</text>
    
    <text x="14" y="56" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">OpenCV &amp; Vision</text>
    <text x="14" y="74" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• QR Matrix finder pattern</text>
    <text x="14" y="90" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• URI parser (upi://pay)</text>
    <text x="14" y="106" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Pin debit param check</text>
    
    <line x1="14" y1="120" x2="156" y2="120" stroke="#1e293b" stroke-width="1"/>
    <circle cx="22" cy="133" r="3" fill="#38bdf8"/>
    <text x="32" y="136" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">PyZbar / NumPy</text>
  </g>

  <!-- ==================== STAGE 3: HEURISTIC CLASSIFIER ==================== -->
  <g transform="translate(460, 95)">
    <rect width="170" height="150" rx="10" fill="#0b1322" stroke="#f59e0b" stroke-width="1.5" class="node-box"/>
    <rect x="12" y="14" width="40" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="18" y="27" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#f59e0b">STAGE 03</text>
    
    <text x="14" y="56" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Heuristic Scoring</text>
    <text x="14" y="74" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Electricity cutoff regex</text>
    <text x="14" y="90" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Fraudulent APK headers</text>
    <text x="14" y="106" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Urgency coercion metric</text>
    
    <line x1="14" y1="120" x2="156" y2="120" stroke="#1e293b" stroke-width="1"/>
    <circle cx="22" cy="133" r="3" fill="#f59e0b"/>
    <text x="32" y="136" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f59e0b">Score: 0-100%</text>
  </g>

  <!-- ==================== STAGE 4: BEDROCK AI ==================== -->
  <g transform="translate(670, 95)">
    <rect width="170" height="150" rx="10" fill="#0b1322" stroke="#a855f7" stroke-width="1.5" class="node-box"/>
    <rect x="12" y="14" width="40" height="18" rx="4" fill="#a855f7" fill-opacity="0.15"/>
    <text x="18" y="27" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#a855f7">STAGE 04</text>
    
    <text x="14" y="56" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Bedrock AI LLM</text>
    <text x="14" y="74" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Claude 3.5 Sonnet</text>
    <text x="14" y="90" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Social engineering scan</text>
    <text x="14" y="106" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Mitigation protocols</text>
    
    <line x1="14" y1="120" x2="156" y2="120" stroke="#1e293b" stroke-width="1"/>
    <circle cx="22" cy="133" r="3" fill="#a855f7"/>
    <text x="32" y="136" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a855f7">Zero PII Leakage</text>
  </g>

  <!-- ==================== STAGE 5: DEFENSE PROOF ==================== -->
  <g transform="translate(880, 95)">
    <rect width="90" height="150" rx="10" fill="#0b1322" stroke="#00e575" stroke-width="1.5" class="node-box"/>
    <rect x="10" y="14" width="40" height="18" rx="4" fill="#00e575" fill-opacity="0.15"/>
    <text x="15" y="27" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#00e575">EXIT</text>
    
    <text x="10" y="56" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Verdict</text>
    <text x="10" y="74" font-family="-apple-system, sans-serif" font-size="9.5" fill="#00e575">SEC-HASH</text>
    <text x="10" y="90" font-family="-apple-system, sans-serif" font-size="9.5" fill="#f1f5f9">Call 1930</text>
    <text x="10" y="106" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Portal Log</text>
    
    <line x1="10" y1="120" x2="80" y2="120" stroke="#1e293b" stroke-width="1"/>
    <circle cx="18" cy="133" r="3" fill="#00e575"/>
    <text x="26" y="136" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#00e575">SHIELD</text>
  </g>

  <!-- Bottom Telemetry Status Bar -->
  <g transform="translate(35, 275)">
    <rect width="935" height="38" rx="8" fill="#060c16" stroke="#1e293b" stroke-width="1"/>
    <circle class="ping-circle" cx="24" cy="19" r="4" fill="#00e575"/>
    <circle cx="24" cy="19" r="4" fill="#00e575"/>
    <text x="38" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8">
      STATUS: PIPELINE STREAMING // OPTICAL MATRIX PASSING // ALL SCAM SCHEMAS ENCRYPTED &amp; NEUTRALIZED
    </text>
    <text x="790" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00e575">
      P99: 112MS
    </text>
  </g>
</svg>
